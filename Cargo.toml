[package]
name = "monolith-desktop"
version = "0.7.0"
edition = "2024"
description = "Monolith's native desktop music player"
publish = false
build = "build.rs"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-path", "unstable-winit-030", "accessibility"] }

rodio = { version = "=0.21.1", features = ["symphonia-all"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rfd = "=0.17.2"
lofty = "=0.25.2"
dirs = "=6.0.0"
url = "=2.5.8"
tempfile = "=3.23.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "=0.6.2"
# Reuse the JSON parser already present in the locked dependency graph.
serde_json = "=1.0.151"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
ring = "=0.17.14"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "=0.8.0"
windows = { version = "=0.54.0", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.54.0", features = ["Media_Control", "Foundation_Collections"] }

# The SMTC probe talks to a Windows-only API, so it is opt-in rather than
# breaking `cargo build --examples` on Linux.
[[example]]
name = "smtc_check"
required-features = ["windows-smtc"]

[features]
windows-smtc = []

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
