name: Desktop packages

on:
  push:
    branches: ['release/v*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  package:
    # Use a free standard public runner for the Linux package.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check release version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            refs/heads/release/v*) tag="${GITHUB_REF_NAME#release/}" ;;
            *) tag="" ;;
          esac
          if [[ -n "$tag" ]]; then
            GITHUB_REF="refs/tags/$tag" GITHUB_REF_NAME="$tag"               python tools/package-metadata.py --check-version
          else
            python tools/package-metadata.py --check-version
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config dpkg-dev \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev libfontconfig1-dev imagemagick
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path installer/Cargo.toml --all --check

      - name: Test and package Linux
        run: |
          cargo test --release --locked --lib --bin monolith-desktop -- --skip tools::tests::saved_path_is_checked_first_and_missing_tools_report_none
          cargo build --release --locked --bin monolith-desktop
          sh packaging/linux/build-deb.sh
          python tools/package-metadata.py --platform linux-amd64 --directory dist

      - name: Attach Debian package to release draft
        if: github.event_name == 'push' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A release branch stages Linux when the tag must be created by CI.
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null) || {
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --silent
              tag_sha="$GITHUB_SHA"
            }
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "Monolith Desktop $RELEASE_TAG" \
              --notes 'Review the Debian package and attach the offline Windows installer before publishing.'
          fi
    permissions:
      contents: write
